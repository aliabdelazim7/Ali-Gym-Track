<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#neonGrad)" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Cyber Octagon Frame -->
  <polygon points="256,48 448,144 448,368 256,464 64,368 64,144" fill="none" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Center Metallic Dumbbell -->
  <g filter="url(#glow)" transform="translate(0, 0)">
    <!-- Barbell Shaft -->
    <rect x="140" y="244" width="232" height="24" rx="12" fill="url(#metalGrad)"/>
    
    <!-- Outer Weight Plates Left -->
    <rect x="110" y="176" width="30" height="160" rx="10" fill="url(#neonGrad)"/>
    <rect x="80" y="196" width="24" height="120" rx="8" fill="url(#metalGrad)"/>
    <rect x="56" y="216" width="18" height="80" rx="6" fill="url(#neonGrad)"/>
    
    <!-- Inner Collar Left -->
    <rect x="146" y="216" width="16" height="80" rx="6" fill="#334155"/>

    <!-- Outer Weight Plates Right -->
    <rect x="372" y="176" width="30" height="160" rx="10" fill="url(#neonGrad)"/>
    <rect x="408" y="196" width="24" height="120" rx="8" fill="url(#metalGrad)"/>
    <rect x="438" y="216" width="18" height="80" rx="6" fill="url(#neonGrad)"/>
    
    <!-- Inner Collar Right -->
    <rect x="350" y="216" width="16" height="80" rx="6" fill="#334155"/>

    <!-- Center Glowing Lightning Bolt -->
    <path d="M266,130 L230,240 L270,240 L240,360 L300,220 L260,220 Z" fill="#fbbf24" filter="url(#glow)"/>
  </g>
</svg>